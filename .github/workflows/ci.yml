name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - working-directory: lab
        run: npm ci
      - working-directory: lab
        run: npm run format:check
      - working-directory: lab
        run: npm run lint
      - working-directory: lab
        run: npm test
      - working-directory: lab
        run: npm run build

  firmware-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Format check
        run: |
          find firmware/src firmware/test -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.c' \
            | sort \
            | xargs clang-format --dry-run --Werror
      - uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Native bridge tests
        run: pio test -d firmware -e native

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
          key: pio-xiao-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build XIAO firmware
        run: pio run -d firmware -e xiao
      - name: Convert HEX to UF2
        run: |
          python ~/.platformio/packages/framework-arduinoadafruitnrf52-seeed/tools/uf2conv/uf2conv.py \
            firmware/.pio/build/xiao/firmware.hex -c -f 0xADA52840 \
            -o firmware/.pio/build/xiao/firmware.uf2
      - uses: actions/upload-artifact@v6
        with:
          name: gotcha-six-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            firmware/.pio/build/xiao/firmware.uf2
            firmware/.pio/build/xiao/firmware.zip
            firmware/.pio/build/xiao/firmware.hex
