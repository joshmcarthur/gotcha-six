name: GotchaSix
options:
  bundleIdPrefix: nz.mcarthur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  GotchaSix:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GotchaSix
        excludes:
          - Info.plist
      # Created by Scripts/build-rust-core.sh before compile. Keep the path in
      # the project even when the gitignored file is absent at checkout.
      - path: GotchaSixCore/Generated/gotcha_six_core.swift
        optional: true
    dependencies:
      - target: GotchaSixActivity
        embed: true
    preBuildScripts:
      - name: Build Rust Core
        basedOnDependencyAnalysis: false
        script: |
          /bin/bash "${SRCROOT}/Scripts/build-rust-core.sh"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: nz.mcarthur.GotchaSix
      INFOPLIST_FILE: GotchaSix/Info.plist
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Automatic
      LIBRARY_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/GotchaSixCore/lib"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-lgotcha_six_core"
      OTHER_SWIFT_FLAGS:
        - "$(inherited)"
        - "-Xcc"
        - "-fmodule-map-file=$(SRCROOT)/GotchaSixCore/Generated/gotcha_six_coreFFI.modulemap"
      SWIFT_INCLUDE_PATHS:
        - "$(SRCROOT)/GotchaSixCore/Generated"
      HEADER_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/GotchaSixCore/Generated"
    scheme:
      testTargets: []
      gatherCoverageData: false

  GotchaSixActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GotchaSixActivity
        excludes:
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: nz.mcarthur.GotchaSix.GotchaSixActivity
      INFOPLIST_FILE: GotchaSixActivity/Info.plist
      GENERATE_INFOPLIST_FILE: false
      CODE_SIGN_STYLE: Automatic
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS:
        - "$(inherited)"
        - "@executable_path/Frameworks"
        - "@executable_path/../../Frameworks"

schemes:
  GotchaSix:
    build:
      targets:
        GotchaSix: all
        GotchaSixActivity: all
    run:
      config: Debug
