[package]
name = "gotcha-six-core"
version = "0.1.0"
edition = "2021"
description = "C4001 radar and Gotcha Six IMU line parser, tracking, and motion interpretation"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
uniffi = { version = "0.29", optional = true }

[features]
default = []
# Do not enable `wasm` and `uniffi` in the same build (separate bindgen stacks).
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde-wasm-bindgen", "dep:js-sys"]
uniffi = ["dep:uniffi"]
# Local bindgen CLI (UniFFI 0.29 has no crates.io binary). Not for app/link builds.
uniffi-cli = ["uniffi", "uniffi/cli"]

[dev-dependencies]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
