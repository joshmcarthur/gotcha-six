; Gotcha Six firmware — Adafruit Bluefruit NUS + USB CDC UART bridge
;
; Board support for xiaoblesense_adafruit comes from the maxgerhardt fork until
; platformio/platform-nordicnrf52#151 lands upstream. Pin the commit after the
; first successful `pio run` on your machine if the floating branch drifts.

[platformio]
default_envs = xiao

[env:xiao]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
board = xiaoblesense_adafruit
framework = arduino
monitor_speed = 115200
lib_archive = no
build_flags =
  -DGS_NATIVE=0
lib_deps =
  adafruit/Adafruit LSM6DS
  adafruit/Adafruit BusIO
  adafruit/Adafruit Unified Sensor

[env:native]
platform = native
build_flags =
  -DGS_NATIVE=1
  -std=c++17
  -I src
test_build_src = true
build_src_filter =
  +<bridge.cpp>
  -<main.cpp>
  -<imu.cpp>
